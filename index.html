<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>투자 일정 공유</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <style>
      :root {
        --bg: #f4f6f8;
        --surface: #ffffff;
        --surface-2: #eef1f4;
        --ink: #141a21;
        --ink-2: #4b5764;
        --ink-3: #8494a3;
        --line: #dde3e9;
        --accent: #0b5e4b;
        --accent-ink: #ffffff;
        --accent-soft: #e3f0ec;
        --gold: #b07d1e;
        --shadow: 0 12px 32px rgba(20, 32, 44, 0.10);
        --radius: 18px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1116;
          --surface: #161c23;
          --surface-2: #1d242e;
          --ink: #eef2f6;
          --ink-2: #a9b6c2;
          --ink-3: #768796;
          --line: #28313d;
          --accent: #35c39a;
          --accent-ink: #06231b;
          --accent-soft: #123129;
          --gold: #e0a83e;
          --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
          "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        line-height: 1.55;
      }
      .wrap {
        max-width: 480px;
        margin: 0 auto;
        padding: 28px 18px calc(40px + env(safe-area-inset-bottom));
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 26px 22px 24px;
      }
      .label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: 999px;
        padding: 5px 11px;
        margin-bottom: 16px;
      }
      .label svg { width: 13px; height: 13px; flex: none; }
      h1 {
        font-size: 26px;
        font-weight: 800;
        line-height: 1.32;
        letter-spacing: -0.01em;
        margin: 0 0 18px;
        word-break: keep-all;
        overflow-wrap: break-word;
      }
      .when {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--surface-2);
        border-radius: 12px;
        padding: 13px 15px;
        margin-bottom: 22px;
      }
      .when svg { width: 19px; height: 19px; flex: none; color: var(--accent); }
      .when .when-text { font-size: 16.5px; font-weight: 700; letter-spacing: -0.01em; }
      .section-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 13.5px;
        font-weight: 800;
        color: var(--ink-2);
        margin: 0 0 8px;
      }
      .section-title .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--gold); flex: none;
      }
      .points {
        font-size: 15.5px;
        color: var(--ink);
        white-space: pre-line;
        word-break: keep-all;
        overflow-wrap: break-word;
        margin: 0 0 4px;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 24px;
      }
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-height: 52px;
        padding: 13px 16px;
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        border-radius: 13px;
        border: 1px solid transparent;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.08s ease, opacity 0.15s ease, background 0.15s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .btn:active { transform: scale(0.985); }
      .btn-primary { background: var(--accent); color: var(--accent-ink); }
      .btn-secondary {
        background: var(--surface);
        color: var(--ink);
        border-color: var(--line);
      }
      .btn .emoji { font-size: 17px; line-height: 1; }
      .btn[hidden] { display: none; }
      .empty {
        text-align: center;
        padding: 18px 6px 8px;
      }
      .empty .big { font-size: 44px; margin-bottom: 14px; }
      .empty h1 { font-size: 21px; margin-bottom: 10px; }
      .empty p {
        font-size: 15px;
        color: var(--ink-2);
        margin: 0;
        word-break: keep-all;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(26px + env(safe-area-inset-bottom));
        transform: translate(-50%, 16px);
        background: var(--ink);
        color: var(--bg);
        font-size: 14.5px;
        font-weight: 600;
        padding: 11px 18px;
        border-radius: 999px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
        max-width: calc(100vw - 40px);
        text-align: center;
        z-index: 10;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }
      @media (prefers-reduced-motion: reduce) {
        .btn, .toast { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <!-- 일정이 있는 경우 -->
      <section class="card" id="eventCard" hidden>
        <span class="label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
          투자 일정
        </span>
        <h1 id="eventTitle"></h1>
        <div class="when" id="whenBlock" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span class="when-text" id="eventWhen"></span>
        </div>
        <div id="pointsBlock" hidden>
          <p class="section-title"><span class="dot"></span>관전 포인트</p>
          <p class="points" id="eventPoints"></p>
        </div>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="shareBtn">
            <span class="emoji" aria-hidden="true">📤</span> 공유하기
          </button>
          <a class="btn btn-secondary" id="calendarBtn" href="#" target="_blank" rel="noopener" hidden>
            <span class="emoji" aria-hidden="true">📅</span> 구글 캘린더 추가
          </a>
          <button type="button" class="btn btn-secondary" id="copyBtn">
            <span class="emoji" aria-hidden="true">🔗</span> 링크 복사
          </button>
        </div>
      </section>

      <!-- 파라미터가 없는 경우 -->
      <section class="card" id="emptyCard" hidden>
        <div class="empty">
          <div class="big" aria-hidden="true">📈</div>
          <h1>공유된 투자 일정이 없어요</h1>
          <p>이 페이지는 투자 일정 공유 링크를 열면 일정 제목과 일시, 관전 포인트를 보여줍니다. 공유받은 링크로 다시 접속해 주세요.</p>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var title = (params.get("t") || "").trim();
        var when = (params.get("w") || "").trim();
        var points = (params.get("d") || "").trim();
        var calUrl = (params.get("a") || "").trim();

        var eventCard = document.getElementById("eventCard");
        var emptyCard = document.getElementById("emptyCard");
        var toast = document.getElementById("toast");
        var toastTimer = null;

        function showToast(msg) {
          toast.textContent = msg;
          toast.classList.add("show");
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            toast.classList.remove("show");
          }, 2400);
        }

        function copyText(text, doneMsg) {
          function fallback() {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            var ok = false;
            try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
            document.body.removeChild(ta);
            showToast(ok ? doneMsg : "복사에 실패했어요. 주소창의 링크를 직접 복사해 주세요.");
          }
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(function () {
              showToast(doneMsg);
            }, fallback);
          } else {
            fallback();
          }
        }

        if (!title) {
          emptyCard.hidden = false;
          return;
        }

        eventCard.hidden = false;
        document.title = title + " · 투자 일정";
        document.getElementById("eventTitle").textContent = title;

        if (when) {
          document.getElementById("whenBlock").hidden = false;
          document.getElementById("eventWhen").textContent = when;
        }
        if (points) {
          document.getElementById("pointsBlock").hidden = false;
          document.getElementById("eventPoints").textContent = points;
        }

        var calBtn = document.getElementById("calendarBtn");
        if (calUrl) {
          calBtn.href = calUrl;
          calBtn.hidden = false;
        }

        var pageUrl = window.location.href;

        document.getElementById("shareBtn").addEventListener("click", function () {
          var shareData = { title: title, text: title + (when ? " · " + when : ""), url: pageUrl };
          if (navigator.share) {
            navigator.share(shareData).catch(function (err) {
              if (err && err.name === "AbortError") return; // 사용자가 취소
              copyText(pageUrl, "링크가 복사됐어요");
            });
          } else {
            copyText(pageUrl, "링크가 복사됐어요");
          }
        });

        document.getElementById("copyBtn").addEventListener("click", function () {
          copyText(pageUrl, "링크가 복사됐어요");
        });
      })();
    </script>
  </body>
</html>
